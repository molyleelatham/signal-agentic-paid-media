[project]
name = "signal-platform"
version = "0.1.0"
description = "Autonomous Media Trading Platform with Attention Token Economy"
authors = [
    {name = "SIGNAL Team"}
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # Web Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Task Processing
    "celery>=5.3.4",
    "redis>=5.0.1",

    # Machine Learning
    "bertopic>=0.16.0",
    "sentence-transformers>=2.2.2",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.3.2",
    "statsmodels>=0.14.0",
    "scipy>=1.11.4",
    "numpy>=1.26.2",
    "pandas>=2.1.4",

    # Deep Learning
    "torch>=2.1.1",

    # External APIs
    "tavily-python>=0.3.0",
    "httpx>=0.25.2",
    "aiohttp>=3.9.1",
    "openai>=1.0.0",

    # Transformers (for Thrad BERT keyword analysis)
    "transformers>=4.35.0",

    # Overmind Integration
    "overmind>=0.1.0",

    # Cursor Agent SDK (Composer 2.5)
    "cursor-sdk>=0.1.5",

    # Utilities
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "orjson>=3.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.8",
    "mypy>=1.7.1",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "services", "shared"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]